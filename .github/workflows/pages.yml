name: Deploy app to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/gods-love-scriptures-5hfdly
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it part-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # One-time setup, which this workflow cannot do for itself: the token it
      # runs with is not allowed to create the Pages site. In the repository's
      # Settings → Pages, set Source to "GitHub Actions". Until that is done
      # this step fails with "Get Pages site failed … Not Found".
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the app
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
